name: Deploy to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

    - name: Rsync files to DreamHost
      run: |
        rsync -avz --delete \
          --exclude='.*' \
          -e "ssh -i ~/.ssh/id_ed25519" \
          ./ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_PATH }}

    - name: Export all other secrets as env vars
      env:
        USER_PASSWORD_1: ${{ secrets.USER_PASSWORD_1 }}
        USER_PASSWORD_2: ${{ secrets.USER_PASSWORD_2 }}
      run: |
        export USER_PASSWORD_1=${{ secrets.USER_PASSWORD_1 }}
        export USER_PASSWORD_2=${{ secrets.USER_PASSWORD_2 }}
